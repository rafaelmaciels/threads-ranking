version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: threads_ranking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: threads_ranking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: threads_ranking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: threads_ranking_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/threads_ranking?schema=public
      - REDIS_URL=redis://redis:6379
      - THREADS_PROVIDER=mock
      - NEXT_PUBLIC_APP_URL=http://localhost:3000

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: threads_ranking_worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/threads_ranking?schema=public
      - REDIS_URL=redis://redis:6379
      - THREADS_PROVIDER=mock

volumes:
  postgres_data:
  redis_data:
